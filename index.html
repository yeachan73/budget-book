<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간단 가계부</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>간단 가계부</h1>

        <form id="transaction-form">
            <div class="form-control">
                <label for="date">날짜</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-control">
                <label for="type">항목</label>
                <select id="type" required>
                    <option value="expense">지출</option>
                    <option value="income">수입</option>
                </select>
            </div>
            <div class="form-control">
                <label for="category">카테고리</label>
                <input type="text" id="category" placeholder="예: 식비, 월급" required>
            </div>
            <div class="form-control">
                <label for="asset-select">자산 선택</label>
                <select id="asset-select" required></select>
            </div>
            <div class="form-control">
                <label for="amount">금액</label>
                <input type="number" id="amount" placeholder="금액을 입력하세요" required>
            </div>
            <button class="btn">내역 추가</button>
        </form>

        <h2>거래 내역</h2>
        <table id="transaction-table">
            <thead>
                <tr>
                    <th>날짜</th>
                    <th>항목</th>
                    <th>카테고리</th>
                    <th>금액</th>
                    <th>삭제</th>
                </tr>
            </thead>
            <tbody id="transaction-list">
                <!-- 자바스크립트로 내역이 추가됩니다 -->
            </tbody>
        </table>

        <h2>자산 관리</h2>
        <form id="asset-form">
            <div class="form-control">
                <label for="asset-name">자산 이름</label>
                <input type="text" id="asset-name" placeholder="예: 내 통장, 현금" required>
            </div>
            <div class="form-control">
                <label for="initial-balance">초기 잔액</label>
                <input type="number" id="initial-balance" placeholder="초기 잔액을 입력하세요" required>
            </div>
            <button class="btn">자산 추가</button>
        </form>
        <h3>자산 현황</h3>
        <ul id="asset-list"></ul>
    </div>

    <!-- 자산 수정/삭제 모달 -->
    <div id="asset-edit-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>자산 수정</h2>
            <form id="asset-edit-form">
                <div class="form-control">
                    <label for="edit-asset-name">자산 이름</label>
                    <input type="text" id="edit-asset-name" required>
                </div>
                <button type="submit" class="btn">수정 완료</button>
            </form>
            <button id="delete-asset-btn" class="btn delete-btn">자산 삭제</button>
            <button id="close-modal-btn" class="close-btn">&times;</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script type="module" src="script.js"></script>
</body>
</html>
