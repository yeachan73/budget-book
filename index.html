<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간단 가계부</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="header-container">
            <h1>간단 가계부</h1>
            <span id="app-version"></span>
        </div>
        
        <form id="transaction-form">
            <div class="form-control">
                <label for="date">날짜</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-control">
                <label for="type">항목</label>
                <select id="type" required>
                    <option value="" selected>-- 항목 선택 --</option>
                    <option value="expense">지출</option>
                    <option value="income">수입</option>
                </select>
            </div>
            <div class="form-control">
                <label for="category">카테고리</label>
                <select id="category" required></select>
            </div>
            <div class="form-control">
                <label for="payment-method-select">결제 수단</label>
                <select id="asset-select" required></select>
            </div>
            <div class="form-control">
                <label for="amount">금액</label>
                <input type="number" id="amount" placeholder="금액을 입력하세요" required>
            </div>
            <button class="btn">내역 추가</button>
        </form>

        <h2>거래 내역</h2>
        <div class="filter-container">
            <div class="form-control">
                <label for="filter-start-date">시작일</label>
                <input type="date" id="filter-start-date">
            </div>
            <div class="form-control">
                <label for="filter-end-date">종료일</label>
                <input type="date" id="filter-end-date">
            </div>
            <button id="filter-btn" class="btn filter-btn">조회</button>
            <button id="reset-filter-btn" class="btn filter-btn">초기화</button>
        </div>

        <table id="transaction-table">
            <thead>
                <tr>
                    <th>날짜</th>
                    <th>항목</th>
                    <th>카테고리</th>
                    <th>금액</th>
                    <th>삭제</th>
                </tr>
            </thead>
            <tbody id="transaction-list">
                <!-- 자바스크립트로 내역이 추가됩니다 -->
            </tbody>
        </table>

        <h2>월별 지출 통계</h2>
        <div class="stats-container">
            <div class="form-control">
                <label for="stats-month">월 선택</label>
                <input type="month" id="stats-month">
            </div>
            <div id="monthly-summary" class="summary-box">
                <div>
                    <span>총수입</span>
                    <span id="summary-income">0원</span>
                </div>
                <div>
                    <span>총지출</span>
                    <span id="summary-expense">0원</span>
                </div>
                <div>
                    <span>순수익</span>
                    <span id="summary-net">0원</span>
                </div>
            </div>
            <canvas id="expense-chart"></canvas>
        </div>

        <h2>카테고리 관리</h2>
        <form id="category-form">
            <div class="form-control">
                <label for="category-name">카테고리 이름</label>
                <input type="text" id="category-name" placeholder="예: 식비, 교통비" required>
            </div>
            <div class="form-control">
                <label for="category-type">항목</label>
                <select id="category-type">
                    <option value="expense">지출</option>
                    <option value="income">수입</option>
                </select>
            </div>
            <button class="btn">카테고리 추가</button>
        </form>
        <h3>카테고리 목록</h3>
        <p><strong>지출:</strong> <span id="expense-category-list"></span></p>
        <p><strong>수입:</strong> <span id="income-category-list"></span></p>

        <h2>결제 수단 관리</h2>
        <form id="asset-form">
            <div class="form-control">
                <label for="asset-name">결제 수단 이름</label>
                <input type="text" id="asset-name" placeholder="예: 내 통장, 현금" required>
            </div>
            <div class="form-control">
                <label for="asset-type">유형</label>
                <select id="asset-type">
                    <option value="account" selected>계좌 (체크카드/현금)</option>
                    <option value="credit_card">신용카드</option>
                </select>
            </div>
            <div class="form-control">
                <label for="initial-balance">초기 잔액 / 카드 한도</label>
                <input type="number" id="initial-balance" placeholder="초기 잔액을 입력하세요" required>
            </div>
            <div id="credit-card-fields" class="form-control" style="display: none;">
                <label for="payment-day">결제일 (1-31일)</label>
                <input type="number" id="payment-day" min="1" max="31">
                <label for="linked-account-select">연동 계좌</label>
                <select id="linked-account-select"></select>
            </div>
            <button class="btn">자산 추가</button>
        </form>
        <h3>결제 수단 현황</h3>
        <ul id="asset-list"></ul>

        <h2>데이터 관리</h2>
        <div class="data-management">
            <button id="export-xlsx-btn" class="btn">거래 내역 Excel(XLSX)로 내보내기</button>
            <div class="form-control">
                <label for="import-csv-input">거래 내역 CSV 파일 가져오기</label>
                <input type="file" id="import-csv-input" accept=".csv">
            </div>
        </div>
    </div>

    <!-- 자산 수정/삭제 모달 -->
    <div id="asset-edit-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>결제 수단 수정</h2>
            <form id="asset-edit-form">
                <div class="form-control">
                    <label for="edit-asset-name">결제 수단 이름</label>
                    <input type="text" id="edit-asset-name" required>
                </div>
                <div class="form-control">
                    <label for="edit-asset-type">유형</label>
                    <select id="edit-asset-type">
                        <option value="account">계좌 (체크카드/현금)</option>
                        <option value="credit_card">신용카드</option>
                    </select>
                </div>
                <div id="edit-credit-card-fields" class="form-control" style="display: none;">
                    <label for="edit-payment-day">결제일 (1-31일)</label>
                    <input type="number" id="edit-payment-day" min="1" max="31">
                    <label for="edit-linked-account-select">연동 계좌</label>
                    <select id="edit-linked-account-select"></select>
                </div>
                <div class="form-control">
                    <label for="edit-asset-balance">잔액/한도</label>
                    <input type="number" id="edit-asset-balance" required>
                </div>
                <button type="submit" class="btn">수정 완료</button>
            </form>
            <button id="delete-asset-btn" class="btn delete-btn">결제 수단 삭제</button>
            <button id="close-modal-btn" class="close-btn">&times;</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script type="module" src="script.js"></script>
</body>
</html>
